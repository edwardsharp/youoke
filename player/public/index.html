<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>youoke.party player</title>
    <link rel="stylesheet" href="player/fonts/fonts.css" />
    <style>
      ::-webkit-scrollbar {
        display: none;
      }
      body {
        font-family: 'VCR OSD Mono';
        display: flex;
        margin: 0;
        padding: 0;
        background-color: black;
        color: white;
      }
      video {
        width: 80vw;
        height: 100vh;
      }
      #q {
        width: 20vw;
        height: 100vh;
        overflow-y: scroll;
      }
      #queue,
      #info {
        overflow-wrap: break-word;
        margin: 1em;
        font-size: 1.75em;
      }
      #info {
        position: absolute;
        bottom: 0;
        right: 0;
        background-color: black;
        text-align: right;
        margin: 0 1em 1em 0;
        padding-bottom: 0.5em;
      }
      #info #code {
        font-size: 2em;
      }
      #info #name {
        font-size: 0.75em;
      }
      #disconnected {
        position: absolute;
        bottom: 25px;
        font-size: 2em;
        line-height: 1.25em;
        z-index: 5;
      }
      .hidden {
        display: none;
      }
      #qr-img {
        filter: invert(1);
      }
      #bumper {
        width: 80vw;
        height: 100vh;
        z-index: 10;
        position: absolute;
        top: 0;
        left: 0;
      }
      .hidden {
        display: none;
      }
    </style>
    <script src="player/bumper.js" defer></script>
  </head>
  <body>
    <canvas id="bumper" width="800" height="300" class="hidden"></canvas>
    <video id="videoEl" poster="player/youoke.png"></video>
    <div id="q">
      <ol id="queue"></ol>
      <div id="disconnected" class="hidden">
        ************ disconnected ************
      </div>

      <div id="info">
        <img id="qr-img" />
        <div>youoke.party</div>
        <div id="code"></div>
        <div id="name"></div>
      </div>
    </div>

    <script type="module">
      import qrcode from 'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm'

      const search = window.location.search
      const params = new URLSearchParams(search)
      const href = params.get('href') || `ws://${window.location.hostname}:9001`
      const name = href
        .replace('ws://', '')
        .replace('wss://', '')
        .replace(/:\d+/, '')

      const code = params.get('code')

      const client_url = `http://youoke.party?href=${href}&code=${code}`
      qrcode.toDataURL(client_url, { width: 256 }, function (err, src) {
        if (err) return console.error(err)
        document.getElementById('qr-img').src = src
      })

      document.getElementById('name').innerText = name
      document.getElementById('code').innerText = code

      var USE_FILE_URLS = !!params.get('use_file_urls')

      var queue = []
      var currentQueueItem
      var duration = 0
      var isPlaying = false
      var isPaused = false
      var isFirstClick = true
      var socket = new WebSocket(`${href}?code=${code}`)

      function reconnect() {
        window.setTimeout(function () {
          console.log('gonna reload...')
          // window.location.reload()
          socket = new WebSocket(`${href}?code=${code}`)
        }, 5000)
      }

      var videoEl = document.getElementById('videoEl')
      var setPlaying = function () {
        isPlaying = true
        isPaused = false
      }
      var setNotPlaying = function () {
        isPlaying = false
      }
      var setPaused = function () {
        isPaused = true
      }
      videoEl.addEventListener('play', setPlaying)
      videoEl.addEventListener('playing', setPlaying)
      videoEl.addEventListener('ended', function () {
        console.log('DONE! gonna DeQueue currentQueueItem:', currentQueueItem)
        setNotPlaying()
        socket.send('{"DeQueue":{"id":"' + currentQueueItem.id + '"}}')
      })
      videoEl.addEventListener('pause', setPaused)
      videoEl.addEventListener('loadedmetadata', function () {
        console.log('videoEl.duration:', videoEl.duration)
        duration = videoEl.duration
      })
      videoEl.addEventListener('complete', setNotPlaying)
      videoEl.addEventListener('click', function (e) {
        if (isFirstClick) {
          bumper.render(
            [`UP NEXT: ${currentQueueItem.singer}`, currentQueueItem.title],
            0,
            () => videoEl.play()
          )
          isFirstClick = false
          return
        }
        if (isPlaying && !isPaused) {
          console.log('gonna try to pause')
          videoEl.pause()
        } else {
          console.log('gonna try play')
          videoEl.play()
        }
      })

      socket.onmessage = function (event) {
        console.log('new msg:', event.data)
        var queueEl = document.getElementById('queue')

        try {
          var data = JSON.parse(event.data)
          if (data === 'PlayerPause') {
            videoEl.pause()
            bumper.render(['PAUSED'], 0)
            return
          }
          if (data === 'PlayerPlay') {
            hideBumper()
            videoEl.play()
            return
          }
          if (data === 'PlayerSkip') {
            destroyPlayer()
            return
          }
          queue = data.queue

          if (queue) {
            //first clear everything
            queueEl.innerHTML = ''

            queue.forEach(function (qItem) {
              var item = document.createElement('li')
              var title = document.createElement('h3')
              title.appendChild(document.createTextNode(qItem.singer))
              item.appendChild(title)
              var singer = document.createElement('div')
              singer.appendChild(
                document.createTextNode(
                  qItem.status === 'Downloading'
                    ? 'Downloading'
                    : qItem.title
                      ? qItem.title
                      : qItem.id
                )
              )
              item.appendChild(singer)

              queueEl.appendChild(item)
            })
          }

          var firstReadyQueueItem = queue.find(function (i) {
            return i.status === 'Ready' && i.filename
          })
          console.log('firstReadyQueueItem:', firstReadyQueueItem)

          if (isPlaying && currentQueueItem.id === firstReadyQueueItem.id) {
            console.log(
              'isPlaying and currently playing queue item has not changed... gonna return early...'
            )
            return
          }

          if (firstReadyQueueItem) {
            // okay! set global currentQueueItem and try to start playing it...
            // #TODO: add a lil' animation here with singer name???!!!
            currentQueueItem = firstReadyQueueItem
            if (USE_FILE_URLS) {
              var filepath = currentQueueItem.filepath
              console.log('gonna try to play video!!! file://', filepath)
              videoEl.setAttribute('src', 'file://' + filepath)
            } else {
              var filename = currentQueueItem.filename
              console.log(
                'gonna try to play video!!! http://localhost:9002/',
                filename
              )
              videoEl.setAttribute('src', 'http://localhost:9002/' + filename)
            }

            videoEl.load()

            if (!isFirstClick) {
              bumper.render(
                [`UP NEXT: ${currentQueueItem.singer}`, currentQueueItem.title],
                0,
                () => videoEl.play()
              )
            }
            videoEl.play()

            return
          }

          // otherwise nothing to do? stop the show i guess
          destroyPlayer()
        } catch (e) {
          console.warn('onoz! caught error parsing JSON e:', e)
        }
      }

      socket.onerror = function (event) {
        console.warn('zomg socket.onerror:', event)
      }
      socket.onclose = function (event) {
        console.log('zomg socket.onclose:', event)
        document.getElementById('disconnected').classList.remove('hidden')
        reconnect()
      }
      socket.onopen = function (event) {
        console.log('zomg socket.onopen:', event)
        document.getElementById('disconnected').classList.add('hidden')
      }

      function send(element) {
        var input = document.getElementById(element)
        socket.send(input.value)
        input.value = ''
      }

      function gotoEnd() {
        console.log('zomg, goto 10 secondz from end!!', duration - 10)
        videoEl.currentTime = duration - 10
      }

      function destroyPlayer() {
        videoEl.pause()
        videoEl.removeAttribute('src') // empty source
        videoEl.load()
        isPlaying = false
        isPaused = false
      }
    </script>
  </body>
</html>
