      > ::-webkit-scrollbar {
        display: none;
      }
      body {
        font-family: 'VCR OSD Mono';
        display: flex;
        margin: 0;
        padding: 0;
        background-color: black;
        color: white;
      }
      #bumper {
        width: 100vw;
        height: 100vh;
        z-index: 10;
        position: absolute;
        top: 0;
        left: 0;
      }
      #message-wrapper {
        z-index: 11;
      }
      #message {
        height: 75vh;
        width: 100vw;
        overflow: hidden;
        resize: none;
        font-size: 3em;
        background-color: black;
        color: white;
      }
      #message-wrapper > div {
        height: 25vh;
        width: 100vw;
      }
      .hidden {
        display: none;
      }

  <body>
    <canvas id="bumper" width="800" height="300"></canvas>
    <div id="message-wrapper">
      <textarea id="message" class="hidden" name="message" rows="5" cols="33">
        ['DO: SWEET EMOTION IN THE NIGHT; END;',
        'DANCING THROUGH DIGITAL STORMZ && LOVE',
        'THE FUTURE IN A VHS DREAM'];
      </textarea>
      <div id="message-close">&nbsp;</div>
    </div>
    <script>
      // ohey all this inline is bumper.js
      function hide() {
        bumper.canvas.classList.add('hidden')
      }

      function wrapText(text, fontSize) {
        bumper.ctx.font = `${fontSize}px 'VCR OSD Mono'`
        const words = text.split(' ')
        const lines = []
        let line = ''

        for (let i = 0; i < words.length; i++) {
          let testLine = line + words[i] + ' '
          let testWidth = bumper.ctx.measureText(testLine).width

          if (testWidth > bumper.maxWidth && i > 0) {
            lines.push(line.trim())
            line = words[i] + ' '
          } else {
            line = testLine
          }
        }
        lines.push(line.trim())
        return lines
      }

      function render(messages, startIndex, done) {
        bumper.messages = messages
        console.log('zomg gonna start bumperz! bumper:', bumper)
        bumper.canvas.classList.remove('hidden')
        const messageIndex = Number(startIndex) || 0
        const text = messages[messageIndex]
        fontSize = 10

        // Calculate best font size
        while (true) {
          const testLines = wrapText(text, bumper.fontSize)
          const totalHeight = testLines.length * bumper.fontSize * 1.2
          const widestLine = Math.max(
            ...testLines.map((line) => bumper.ctx.measureText(line).width)
          )

          if (widestLine > bumper.maxWidth || totalHeight > bumper.maxHeight) {
            bumper.fontSize -= 2
            bumper.lines = wrapText(text, bumper.fontSize)
            break
          }

          bumper.fontSize += 2
        }

        // Clear canvas
        bumper.ctx.fillStyle = '#000000'
        bumper.ctx.fillRect(0, 0, bumper.canvas.width, bumper.canvas.height)

        const totalHeight = bumper.lines.length * bumper.fontSize * 1.2
        const baseY = (bumper.canvas.height - totalHeight) / 2 + bumper.fontSize

        let scanX = 0
        let scanY = 0
        const stepX = 25
        const stepY = 25
        const delay = 10

        function scanFrame() {
          bumper.ctx.save()
          bumper.ctx.font = `${bumper.fontSize}px 'VCR OSD Mono'`
          bumper.ctx.fillStyle = 'white'
          bumper.ctx.shadowColor = 'magenta'
          bumper.ctx.shadowBlur = parseInt(
            Math.random() * 10 > 3 ? Math.random() * 20 : Math.random() * 69
          )

          bumper.ctx.beginPath()
          bumper.ctx.rect(0, 0, scanX, scanY)
          bumper.ctx.clip()

          bumper.lines.forEach((line, i) => {
            const lineWidth = bumper.ctx.measureText(line).width
            const x = (bumper.canvas.width - lineWidth) / 2
            const y = baseY + i * bumper.fontSize * 1.2
            bumper.ctx.fillText(line, x, y)
          })

          bumper.ctx.restore()

          scanX += stepX
          if (scanX > bumper.canvas.width) {
            scanX = 0
            scanY += stepY
          }

          if (scanY <= bumper.canvas.height) {
            setTimeout(scanFrame, delay)
          } else {
            // Pause before next message
            if (messageIndex + 1 < messages.length) {
              setTimeout(
                () => bumper.render(messages, messageIndex + 1, done),
                1000
              )
            } else {
              // All messages done — leave last one on screen (unless done cb)
              console.log(
                '✨ zee bumperz are done and done ANDAND !!done:',
                !!done
              )
              done && bumper.hide()
              done && done()
              // or i guess if nothing else, have a go again
              !done &&
                setTimeout(() => {
                  bumper.render(messages, 0, done)
                }, 1000)
            }
          }
        }

        scanFrame()
      }

      function setup() {
        const canvas = document.getElementById('bumper')
        const ctx = canvas.getContext('2d')
        const maxWidth = canvas.width * 0.9
        const maxHeight = canvas.height * 0.9

        let fontSize = 10
        let lines = []

        bumper = {
          ...bumper,
          canvas,
          ctx,
          maxWidth,
          maxHeight,
          fontSize,
          lines,
        }
      }

      const DEMO_MESSAGES = [
        'DO: SWEET EMOTIONZ IN THE NIGHT; END;',
        'DANCING THROUGH DIGITAL STORMZ && LOVE',
        'THE FUTURE IN A VHS DREAM',
      ]

      let bumper = {
        setup,
        render,
        hide,
        DEMO_MESSAGES,
      }

      // end bumper.js code;
      // okay, moving on...
      // wait for font to load before starting
      document.fonts.ready.then(() => {
        bumper.setup()
        bumper.render(DEMO_MESSAGES, 0, () => {
          const messageEl = document.getElementById('message')
          bumper.render(messageEl.value.split('\n'), 0, null)
        })

        document.addEventListener('click', () => {
          const messageEl = document.getElementById('message')

          if (messageEl.classList.contains('hidden')) {
            console.log('body click messageEl:', messageEl)
            messageEl.classList.remove('hidden')
            messageEl.focus()
          }
        })

        const messageEl = document.getElementById('message')
        messageEl.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            messageEl.classList.add('hidden')
          }
        })
        const messageCloseEl = document.getElementById('message-close')
        messageCloseEl.addEventListener('click', (e) => {
          e.stopPropagation()
          e.preventDefault()
          console.log('message close click!')
          messageEl.classList.add('hidden')
          bumper.render(messageEl.value.split('\n'), 0, null)
        })
      })
    </script>
  </body>
